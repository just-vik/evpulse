<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a0a2e"/>
      <stop offset="1" stop-color="#0a0d18"/>
    </linearGradient>
    <linearGradient id="bolt" x1="24" y1="8" x2="28" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ecgl" x1="4" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#a855f7"/>
      <stop offset="0.7" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <!-- Lightning bolt -->
  <path d="M28 7L22 22.5H28L22.5 41L36 21H29L33 7Z" fill="url(#bolt)" filter="url(#glow)"/>
  <!-- ECG line through bolt base -->
  <path d="M4 33h5l2-8.5 2.5 8.5 2-5 2 5 2-10 2.5 10H44" stroke="url(#ecgl)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
</svg>
